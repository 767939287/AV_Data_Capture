# 详细教程请看
# - https://github.com/yoshiko2/Movie_Data_Capture/wiki/%E9%85%8D%E7%BD%AE%E6%96%87%E4%BB%B6
[common]
main_mode = 1
source_folder = ./
failed_output_folder = failed
success_output_folder = JAV_output
link_mode = 0
; 0: 不刮削硬链接文件 1: 刮削硬链接文件
scan_hardlink = 0
failed_move = 0
auto_exit = 0
translate_to_sc = 0
; 【当前无效/预留项】multi_threading 目前不启用任何真实多线程。
; 主刮削流程始终为单线程顺序处理（逐个视频），此值仅会让启动日志多打印一句 "multi_threading on"，
; 不影响实际行为。真正的并发只在 [storyline] run_mode 与 [extrafanart] parallel_download 中生效。
; 保留此项仅为兼容旧配置，建议保持 0。
multi_threading = 0
;actor_gender value: female(♀) or male(♂) or both(♀ ♂) or all(♂ ♀ ⚧)
actor_gender = female
del_empty_folder = 1
; 跳过最近(默认:30)天新修改过的.NFO，可避免整理模式(main_mode=3)和软连接(soft_link=0)时
; 反复刮削靠前的视频文件，0为处理所有视频文件
nfo_skip_days = 30
ignore_failed_list = 0
; 每次刮削任务开始时，在 failed_list.txt 末尾写入一条“分隔行”以标记本次批次（便于分格/分批任务识别）。
; 分隔行为标准 54 字符宽、时间居中的格式，例如：======== 2026-03-14 20:21:55 ========
; 规则：文件不存在或为空时不写；若最后一行已是分隔行则更新其时间戳(避免空批次出现连续分隔行)；
;       否则追加一行。程序绝不会删除 failed_list.txt 的已有内容。
; 留空则关闭自动分隔；非空即启用（内容仅作开关，分隔行统一使用标准宽度）。
failed_list_separator = 1
download_only_missing_images = 1
mapping_table_validity = 7
; 一些jellyfin中特有的设置 (0:不开启， 1：开启) 比如
; 在jellyfin中tags和genres重复，因此可以只需保存genres到nfo中
; jellyfin中只需要保存thumb，不需要保存fanart
jellyfin = 0
; 开启后tag和genere只显示演员
actor_only_tag = 0
sleep = 3
anonymous_fill = 1

[advenced_sleep]
; 处理完多少个视频文件后停止，0为处理所有视频文件
stop_counter = 0
; 再运行延迟时间，单位：h时m分s秒 举例: 1h30m45s(1小时30分45秒)  45(45秒)
; stop_counter不为零的条件下才有效，每处理stop_counter部影片后延迟rerun_delay秒再次运行
rerun_delay = 0
; 以上参数配合使用可以以多次少量的方式刮削或整理数千个文件而不触发翻译或元数据站封禁

[proxy]
;proxytype: http or socks5 or socks5h switch: 0 1
switch = 0
type = socks5h
proxy = 127.0.0.1:1080
timeout = 20
retry = 3
cacert_file =

[Name_Rule]
location_rule = actor+"/"+number
naming_rule = number+"-"+title
max_title_len = 50
; 刮削后图片是否命名为番号
image_naming_with_number = 0
; 番号大写 1 | 0, 仅在写入数据时会进行大写转换, 搜索刮削流程则不影响
number_uppercase = 0
; 自定义正则表达式, 多个正则使用空格隔开, 第一个分组为提取的番号, 若自定义正则未能匹配到番号则使用默认规则
; example: ([A-Za-z]{2,4}\-\d{3}) ([A-Za-z]{2,4}00\d{3})
number_regexs = 

; 自动更新检测 / 映射表下载功能（原项目已废弃，注释保留以便追溯）
; [update]
; update_check = 0

[priority]
website = javbus
#airav,fanza,xcity,mgstage,avsox,jav321,madou,javday,javmenu,javdb,javlibrary
; 跨源 DMM 高清封面：1=开启 0=关闭(默认)
; 开启后，即使当前刮削源不是 DMM/FANZA，也会按番号去 DMM 搜索取高清封面
; (awsimgsrc.dmm.co.jp/pics_dig) 替换原封面，取不到则保留原封面，不影响刮削。
; 注意：会额外发起 DMM 搜索/图片校验请求，可能略增刮削耗时。
dmm_image = 0

; 跨源标签补全：填刮削器名（如 javbus / javdb 等），多个用逗号分隔。
; 填了之后，无论主数据源是什么（如 source=dmm/fanza），都会额外用这些刮削器
; 按番号取标签(tag)，再与主源标签按下方 tag_mode 合并/替换。
; 留空=禁用（默认，行为与升级前完全一致）。
; 例：主源用 fanza（日文标签少），想让标签用 javbus 的，则填 tag_source = javbus
tag_source =
; 合并模式：merge=主源标签+跨源标签去重合并(默认)；replace=仅用跨源标签替换主源标签。
tag_mode = merge

[escape]
literals = \()/
folders = failed,JAV_output

[debug_mode]
switch = 1

[translate]
switch = 0
; engine: google-free,azure,deeplx
engine = google-free
; en_us fr_fr de_de... (only google-free now)
target_language = zh_cn
; Azure translate API key
key =
; Translate delay, Bigger Better
delay = 3
; title,outline,actor,tag
values = title,outline
; Google translate site, or Deeplx site
service_site = translate.google.com

; 预告片
[trailer]
switch = 0

[uncensored]
uncensored_prefix = PT-,S2M,BT,LAF,SMD,SMBD,SM3D2DBD,SKY-,SKYHD,CWP,CWDV,CWBD,CW3D2DBD,MKD,MKBD,MXBD,MK3D2DBD,MCB3DBD,MCBD,RHJ,MMDV

[media]
media_type = .mp4,.avi,.rmvb,.wmv,.mov,.mkv,.flv,.ts,.webm,.iso,.mpg,.m4v
sub_type = .smi,.srt,.idx,.sub,.sup,.psb,.ssa,.ass,.usf,.xss,.ssf,.rt,.lrc,.sbv,.vtt,.ttml

; 水印
[watermark]
switch = 0
water = 2
; 左上 0, 右上 1, 右下 2， 左下 3

; 剧照
[extrafanart]
switch = 0
parallel_download = 5
extrafanart_folder = extrafanart

; 剧情简介
[storyline]
switch = 1
; website为javbus javdb avsox xcity carib时，site censored_site uncensored_site 为获取剧情简介信息的
; 可选数据源站点列表。列表内站点同时并发查询，取值优先级由冒号前的序号决定，从小到大，数字小的站点没数据才会采用后面站点获得的。
; 其中airavwiki airav avno1 58avgo是中文剧情简介，fanza与mgstage是日文剧情简介(分别取自FANZA/DMM与MGStage详情页)。
; 有码可用：airav airavwiki avno1 xcity fanza mgstage；无码可用：58avgo avno1 airavwiki。
; 若想让 FANZA/MGStage 的日文简介优先，把对应站点放到列表最前面即可。
site = fanza,mgstage,airav,avno1,airavwiki
censored_site = fanza,mgstage,airav,avno1,xcity
uncensored_site = 58avgo
; 是否优先使用靠前站点(如fanza/mgstage)的日文简介：1=按站点列表顺序取第一个有结果的简介(即使是日文)；
; 0=优先选择中文简介，只有全是日文简介时才选第一个日文的。想"fanza/mgstage优先"就设为1。
prefer_jp = 1
; 运行模式：0:顺序执行(最慢) 1:线程池(默认值) 2:进程池(启动开销比线程池大，并发站点越多越快)
run_mode = 1
; 各剧情简介站点的「整站整体超时」(秒)：指该站从开始到返回的整个刮削流程总时长上限
; (含其中的多次请求与重试)，超过即放弃该站结果，由其他站点顶上，避免某站卡死拖慢整体。
; 直接写数字即为所有站点的默认值，无需写 default=。
;   timeout = 15                 所有站点整站最多 15 秒
;   timeout = fanza=20,airav=10  只单独指定列出的站点(其余站点不设整体超时)
;   timeout = 15,fanza=20        默认 15，fanza 单独 20
; 可用站点名：airavwiki,airav,avno1,xcity,58avgo,fanza,mgstage
; 不填写则各站点不设整体超时(行为与升级前一致，各请求用程序内置默认单请求超时)。
timeout =
; show_result剧情简介调试信息 0关闭 1简略 2详细(详细部分不记入日志)，剧情简介失效时可打开2查看原因
show_result = 2
debug=true

; 繁简转换 繁简转换模式mode=0:不转换 1:繁转简 2:简转繁
[cc_convert]
mode = 1
vars = outline,series,studio,tag,title

[javdb]
sites = 521

; javlibrary 主站域名
; 默认 https://www.javlibrary.com（原始主站）
; 若主站被墙/失效，可改为主站或当前可用镜像（如 https://www.a95i.com），随时切换。
; 只填协议+域名，末尾不要带 /。
[javlibrary]
domain = https://www.javlibrary.com

; javbus 主站/备用镜像域名
; domain: 主站域名，默认 https://www.javbus.com
; mirror: 主站请求异常时的兜底镜像，默认 https://www.buscdn.casa
; 主站/镜像失效时可随时改这里切换，无需改代码。只填协议+域名，末尾不要带 /。
[javbus]
domain = https://www.javbus.com
mirror = https://www.buscdn.casa

; 人脸识别 locations_model=hog:方向梯度直方图(不太准确，速度快) cnn:深度学习模型(准确，需要GPU/CUDA,速度慢)
; uncensored_only=0:对全部封面进行人脸识别 1:只识别无码封面，有码封面直接切右半部分
; aways_imagecut=0:按各网站默认行为 1:总是裁剪封面，开启此项将无视[common]download_only_missing_images=1总是覆盖封面
; 封面裁剪的宽高比可配置，公式为aspect_ratio/3。默认aspect_ratio=2.12: 适配大部分有码影片封面，前一版本默认为2/3即aspect_ratio=2
[face]
locations_model = hog
uncensored_only = 1
aways_imagecut = 0
aspect_ratio = 2.13

[jellyfin]
multi_part_fanart = 0

[actor_photo]
download_for_kodi = 0

[direct]
switch = 1

; DMM/FANZA 高清图升级
; switch: 1=开启 0=关闭(默认)
; 开启后，当刮削得到的封面/海报来自 DMM/FANZA(pics.dmm.co.jp) 时，
; 尝试替换为 DMM 官方高清 CDN(awsimgsrc.dmm.co.jp/pics_dig) 的图：
;   - 封面优先横版高清(pl.jpg)，无则退回竖版(ps.jpg)
;   - 海报使用竖版高清(ps.jpg)
; 每个候选都会校验是否有效(HEAD)，全部失败则保留原图，不影响刮削结果。
; 关闭时行为与升级前完全一致。
[dmm_image]
switch = 0

; DMM 官方 Affiliate API（FANZA 内容同源，更稳定）
; switch: 1=开启 0=关闭(默认)
; 开启后，fanza 数据源会优先调用 DMM 官方 Affiliate API
; (api.dmm.com/affiliate/v3/ItemList) 按番号检索；失败(无匹配/网络异常)时
; 自动回退到爬取 www.dmm.co.jp 详情页，不影响刮削结果。
; 注意：FANZA 是 DMM 的成人内容品牌(DMM.R18)，二者内容同源，API 检索即 FANZA 检索。
;
; 申请地址(免费)：
;   https://affiliate.dmm.com/   （注册后进入后台 -> API -> 获取 api_id 与 affiliate_id）
;   英文说明：https://affiliate.dmm.com/en/
; 申请步骤简述：
;   1. 打开 https://affiliate.dmm.com/ 注册/登录 DMM 账号
;   2. 进入「API」页面，创建应用，复制 api_id 与 affiliate_id
;   3. 把两者填入下方（可留空则使用内置默认值，但默认值可能限流/失效，建议填自己的）
[dmm_api]
switch = 0
; api_id / affiliate_id 可留空，使用内置默认值(公开测试凭据)；强烈建议填自己的。
api_id =
affiliate_id =
