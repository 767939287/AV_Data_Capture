# 详细教程请看
# - https://github.com/yoshiko2/Movie_Data_Capture/wiki/%E9%85%8D%E7%BD%AE%E6%96%87%E4%BB%B6
[common]
; 主工作模式 main_mode：
;   1 = 刮削模式(默认)      联网抓取元数据，下载封面/海报/剧照等并生成 .nfo，
;                           最后把视频及文件整理/移动到 success_output_folder(成功目录)。
;   2 = 整理模式            不联网抓取元数据，仅按番号规则重命名并移动视频到成功目录，
;                           顺带就地搬运同名外挂字幕(不下载字幕)。
;   3 = 不改变路径刮削      在源目录原地刮削：下载图片、生成 .nfo，视频文件保持原位不动。
;                           (常配合 -N/--no-network-operation 做纯裁图用途；配合 nfo_skip_days
;                            跳过近期已刮削的文件，避免重复处理。)
;   4 = 只下载字幕          在源目录就地下载字幕(简/繁)，不下载图片、不生成 .nfo、不移动视频。
;                           是否跳过 nfo_skip_days 检查由下方 skip_nfo_check_in_subtitle_mode 控制。
; 提示：也可用命令行 -m/--main-mode 临时覆盖此值。
main_mode = 1
; 待刮削/整理的视频文件所在目录(源目录)。支持相对/绝对路径，模式1/2/3/4均从该目录扫描视频。
source_folder = ./
; 刮削失败、无法识别番号等文件会被记录/移动至此目录(见 failed_move)。
failed_output_folder = failed
; 刮削成功(模式1)或整理成功(模式2)后，视频及附属文件最终存放的目录。
success_output_folder = JAV_output
; 处理视频文件的方式：0=直接移动(不建立链接) 1=建立软链接 2=优先硬链接(无法硬链接时回退软链接)。
; 模式3、模式4 本身不移动视频文件，本项对其无影响。
link_mode = 0
; 0: 不刮削硬链接文件 1: 刮削硬链接文件
scan_hardlink = 0
; 无链接模式(link_mode=0)下，处理失败时是否把源文件移动到 failed_output_folder；0=否(仅记录) 1=是。
failed_move = 0
; 全部任务完成后是否自动退出，0=退出前等待回车 1=直接退出。
auto_exit = 0
; 【旧项】历史上用于将元数据繁转简；现由 [cc_convert] 段统一控制繁简转换，建议保持 0。
translate_to_sc = 0
; 【当前无效/预留项】multi_threading 目前不启用任何真实多线程。
; 主刮削流程始终为单线程顺序处理（逐个视频），此值仅会让启动日志多打印一句 "multi_threading on"，
; 不影响实际行为。真正的并发只在 [storyline] run_mode 与 [extrafanart] parallel_download 中生效。
; 保留此项仅为兼容旧配置，建议保持 0。
multi_threading = 0
; 演员性别筛选：female(仅女) / male(仅男) / both(男女) / all(全部，含人妖)。
actor_gender = female
; 处理结束后是否删除空的输出目录(成功/失败目录及源目录内的空文件夹)：0=保留 1=删除。
del_empty_folder = 1
; 跳过最近(默认:30)天新修改过的.NFO，可避免整理模式(main_mode=3)和软连接(soft_link=0)时
; 反复刮削靠前的视频文件，0为处理所有视频文件
nfo_skip_days = 30
; 仅在只下载字幕模式(main_mode=4)生效。
; 1(默认): 跳过 nfo_skip_days 检查，对源目录下所有视频都尝试下载字幕；
; 0: 执行 nfo_skip_days 检查，跳过最近 nfo_skip_days 天内修改过 .nfo 的视频(与整理模式行为一致)。
skip_nfo_check_in_subtitle_mode = 1
; 是否忽略 failed_list.txt 中记录的失败文件：0=不忽略(跳过这些失败文件) 1=忽略(重新尝试处理)。
ignore_failed_list = 0
; 失败列表(failed_list.txt)位置。留空(默认)=沿用 failed_output_folder 目录内(向后兼容)；
; 填目录=把 failed_list.txt 放到该目录下；填以 .txt 结尾的完整路径=直接使用该文件。
; 例(留空)：failed_list_path =
;          -> failed/failed_list.txt   (跟随 failed_output_folder)
; 例(目录)：failed_list_path = ./lists
;          -> ./lists/failed_list.txt
; 例(目录)：failed_list_path = D:/mdc/logs
;          -> D:/mdc/logs/failed_list.txt
; 例(文件)：failed_list_path = ./lists/my_failed.txt
;          -> ./lists/my_failed.txt
failed_list_path =
; 无法识别列表(unrecognized_list.txt)位置。留空(默认)=沿用 failed_output_folder 目录内；
; 记录“没能进入正常刮削流程”的文件：番号识别失败(文件名提取不出番号) + 数据源查无数据(not found)。
; 填目录=把 unrecognized_list.txt 放到该目录下；填以 .txt 结尾的完整路径=直接使用该文件。
; 例(留空)：unrecognized_list_path =
;          -> failed/unrecognized_list.txt   (跟随 failed_output_folder)
; 例(目录)：unrecognized_list_path = ./lists
;          -> ./lists/unrecognized_list.txt
; 例(目录)：unrecognized_list_path = D:/mdc/logs
;          -> D:/mdc/logs/unrecognized_list.txt
; 例(文件)：unrecognized_list_path = ./lists/my_unrecognized.txt
;          -> ./lists/my_unrecognized.txt
unrecognized_list_path =
; 每次刮削任务开始时，在 failed_list.txt 末尾写入一条“分隔行”以标记本次批次（便于分格/分批任务识别）。
; 分隔行为标准宽度：左右各 17 个 '='，中间为时间，总宽约 54 字符，例如：
;   ================= 2026-03-14 20:21:55 =================
; 规则：文件不存在或为空时不写；若最后一行已是分隔行则更新其时间戳(避免空批次出现连续分隔行)；
;       否则追加一行。程序绝不会删除 failed_list.txt 的已有内容。
; 留空则关闭自动分隔；非空即启用（内容仅作开关，分隔行统一使用上述标准宽度）。
failed_list_separator = 1
; 图片下载策略：1=仅下载缺失的图片(已存在则跳过) 0=总是重新下载覆盖。
download_only_missing_images = 1
; 映射表(mapping table)的有效期(天)，超过则视为过期并重新下载。
mapping_table_validity = 7
; 一些jellyfin中特有的设置 (0:不开启， 1：开启) 比如
; 在jellyfin中tags和genres重复，因此可以只需保存genres到nfo中
; jellyfin中只需要保存thumb，不需要保存fanart
jellyfin = 0
; 开启后tag和genere只显示演员
actor_only_tag = 0
; 处理每个视频之间的随机等待时间(秒)，实际等待为 sleep ~ sleep+2 秒，用于降低被站点封禁的风险。
sleep = 3
; 演员信息匿名填充：无演员数据时是否用占位/匿名内容填充，0=否 1=是。
anonymous_fill = 1

[advenced_sleep]
; 处理完多少个视频文件后停止，0为处理所有视频文件
stop_counter = 0
; 再运行延迟时间，单位：h时m分s秒 举例: 1h30m45s(1小时30分45秒)  45(45秒)
; stop_counter不为零的条件下才有效，每处理stop_counter部影片后延迟rerun_delay秒再次运行
rerun_delay = 0
; 以上参数配合使用可以以多次少量的方式刮削或整理数千个文件而不触发翻译或元数据站封禁

[proxy]
; 代理开关：0=不使用代理(直连) 1=使用下方代理。
switch = 0
; 代理协议类型，可选：http / socks5 / socks5h
type = socks5h
; 代理地址，格式 主机:端口（不要带 http:// 前缀），例如 127.0.0.1:1080。
proxy = 127.0.0.1:1080
; 单次网络请求超时(秒)。
timeout = 20
; 网络请求失败时的重试次数(图片/影片下载等)。
retry = 3
; 自定义 CA 证书文件(可选)。用于自签证书/抓包场景，留空则使用系统默认证书。
cacert_file =

[Name_Rule]
; 成功目录内影片的“子目录”命名规则(模式1/模式2把文件移动到成功目录时使用)。
; 用 Python 表达式书写，可用的变量来自刮削数据，例如：actor(演员) number(番号) title(标题)
; 等，字符串用单/双引号。
;   例：actor+"/"+number   -> 《演员名》/《番号》  （默认：按演员分文件夹）
;   例：number             -> 直接把影片放在成功目录下(不建子目录)
; 注意：actor 为空时会被计算为绝对路径，程序已做兼容处理(自动转为相对路径)。
location_rule = actor+"/"+number
; 元数据/影片文件的“命名规则”(模式1，以及模式2重命名文件时使用)。
; 同样是 Python 表达式，常用变量：number(番号) title(标题) actor(演员) studio(片商) year(年份) 等。
;   例：number+"-"+title   -> 《番号-标题》  （默认）
; 建议保留番号在前，便于排序与查找。
naming_rule = number+"-"+title
; 标题最大长度。当 location_rule/naming_rule 里用到 title 且标题过长时，按此长度截断，防止文件名过长。
max_title_len = 50
; 刮削后图片是否命名为番号。0=按 poster/thumb/fanart 默认名 1=在前面加上番号前缀
; (如 番号-poster.jpg)，便于与其它影片的图片区分。
image_naming_with_number = 0
; 番号大写 1 | 0, 仅在写入数据时会进行大写转换, 搜索刮削流程则不影响
number_uppercase = 0
; 自定义正则表达式, 多个正则使用空格隔开, 第一个分组为提取的番号, 若自定义正则未能匹配到番号则使用默认规则
; example: ([A-Za-z]{2,4}\-\d{3}) ([A-Za-z]{2,4}00\d{3})
number_regexs = 

; 自动更新检测 / 映射表下载功能（原项目已废弃，注释保留以便追溯）
; [update]
; update_check = 0

[priority]
; 主数据源(刮削器)。程序用该站点按番号抓取元数据。
; 可选值：airav, fanza, xcity, mgstage, avsox, jav321, madou, javday, javmenu, javdb, javlibrary, javbus
; 也可用命令行 -w/--website 临时覆盖。
website = javbus
; 跨源 DMM 高清封面：1=开启 0=关闭(默认)
; 开启后，即使当前刮削源不是 DMM/FANZA，也会按番号去 DMM 搜索取高清封面
; (awsimgsrc.dmm.co.jp/pics_dig) 替换原封面，取不到则保留原封面，不影响刮削。
; 注意：会额外发起 DMM 搜索/图片校验请求，可能略增刮削耗时。
dmm_image = 0

; 跨源标签补全：填刮削器名（如 javbus / javdb 等），多个用逗号分隔。
; 填了之后，无论主数据源是什么（如 source=dmm/fanza），都会额外用这些刮削器
; 按番号取标签(tag)，再与主源标签按下方 tag_mode 合并/替换。
; 留空=禁用（默认，行为与升级前完全一致）。
; 例：主源用 fanza（日文标签少），想让标签用 javbus 的，则填 tag_source = javbus
tag_source =
; 合并模式：merge=主源标签+跨源标签去重合并(默认)；replace=仅用跨源标签替换主源标签。
tag_mode = merge

[escape]
; 在生成文件/目录名时需要从名称中剔除的字符(避免非法路径)。此处列出需要转义的符号。
literals = \()/
; 扫描源目录时需要跳过的子目录名(逗号分隔)。通常把成功/失败输出目录排除，避免重复刮削它们。
folders = failed,JAV_output

[debug_mode]
; 调试开关：0=关闭(默认) 1=开启。开启后打印详细调试日志(番号、数据源、下载过程等)，
; 并生成用于反馈问题的诊断信息。日常使用建议保持 0，可显著减少日志量。
switch = 0

[translate]
; 是否启用翻译：0=不翻译(默认) 1=启用。
switch = 0
; 翻译引擎，可选：google-free / azure / deeplx。
engine = google-free
; 目标语言代码，如 zh_cn(简体中文)、en_us、fr_fr、de_de 等(目前仅 google-free 引擎可用)。
target_language = zh_cn
; Azure 翻译 API 的 key(仅 engine=azure 时需要)。
key =
; 每次翻译之间的等待时间(秒)。数值越大越不容易被限制，但更慢。
delay = 3
; 需要翻译的字段(逗号分隔)，例如：title,outline,actor,tag。
values = title,outline
; 翻译服务站点：google-free 填 Google 翻译站点(如 translate.google.com)；
; engine=deeplx 时填 Deeplx 服务地址。
service_site = translate.google.com

; 预告片
[trailer]
; 是否下载预告片(trailer)：0=不下载(默认) 1=下载。下载后保存为 番号-trailer.mp4。
switch = 0

[uncensored]
; 判定“无码”影片的番号前缀列表(逗号分隔，不区分大小写)。命中则标记为无码。
uncensored_prefix = PT-,S2M,BT,LAF,SMD,SMBD,SM3D2DBD,SKY-,SKYHD,CWP,CWDV,CWBD,CW3D2DBD,MKD,MKBD,MXBD,MK3D2DBD,MCB3DBD,MCBD,RHJ,MMDV

[media]
; 扫描时视为“视频文件”的后缀列表(逗号分隔)。
media_type = .mp4,.avi,.rmvb,.wmv,.mov,.mkv,.flv,.ts,.webm,.iso,.mpg,.m4v
; 视为“字幕文件”的后缀列表(逗号分隔)，用于搬运同名外挂字幕。
sub_type = .smi,.srt,.idx,.sub,.sup,.psb,.ssa,.ass,.usf,.xss,.ssf,.rt,.lrc,.sbv,.vtt,.ttml

; 水印
[watermark]
; 是否给海报/缩略图添加属性水印(字幕/无码/破解/4K/原盘等角标)：0=不添加(默认) 1=添加。
switch = 0
; 水印起始位置(顺时针)：左上 0，右上 1，右下 2，左下 3。
water = 2

; 剧照
[extrafanart]
; 是否下载剧照(extrafanart)：0=不下载(默认) 1=下载。
switch = 0
; 剧照下载的线程数(并发数)；越大越快，但过大可能被站点封 IP。0 或缺失按 5 处理。
parallel_download = 5
; 剧照保存的子目录名(位于影片目录下)。
extrafanart_folder = extrafanart

; 剧情简介
[storyline]
; 是否抓取剧情简介(outline/plot)：0=不抓取 1=抓取(默认)。
switch = 1
; website为javbus javdb avsox xcity carib时，site censored_site uncensored_site 为获取剧情简介信息的
; 可选数据源站点列表。列表内站点同时并发查询，取值优先级由冒号前的序号决定，从小到大，数字小的站点没数据才会采用后面站点获得的。
; 其中airavwiki airav avno1 58avgo是中文剧情简介，fanza与mgstage是日文剧情简介(分别取自FANZA/DMM与MGStage详情页)。
; 有码可用：airav airavwiki avno1 xcity fanza mgstage；无码可用：58avgo avno1 airavwiki。
; 若想让 FANZA/MGStage 的日文简介优先，把对应站点放到列表最前面即可。
site = fanza,mgstage,airav,avno1,airavwiki
censored_site = fanza,mgstage,airav,avno1,xcity
uncensored_site = 58avgo
; 是否优先使用靠前站点(如fanza/mgstage)的日文简介：1=按站点列表顺序取第一个有结果的简介(即使是日文)；
; 0=优先选择中文简介，只有全是日文简介时才选第一个日文的。想"fanza/mgstage优先"就设为1。
prefer_jp = 1
; 运行模式：0:顺序执行(最慢) 1:线程池(默认值) 2:进程池(启动开销比线程池大，并发站点越多越快)
run_mode = 1
; 各剧情简介站点的「整站整体超时」(秒)：指该站从开始到返回的整个刮削流程总时长上限
; (含其中的多次请求与重试)，超过即放弃该站结果，由其他站点顶上，避免某站卡死拖慢整体。
; 直接写数字即为所有站点的默认值，无需写 default=。
;   timeout = 15                 所有站点整站最多 15 秒
;   timeout = fanza=20,airav=10  只单独指定列出的站点(其余站点不设整体超时)
;   timeout = 15,fanza=20        默认 15，fanza 单独 20
; 可用站点名：airavwiki,airav,avno1,xcity,58avgo,fanza,mgstage
; 不填写则各站点不设整体超时(行为与升级前一致，各请求用程序内置默认单请求超时)。
timeout =
; 剧情简介调试信息等级：0=关闭 1=简略 2=详细(详细部分不记入日志)。剧情简介失效时可设为2查看原因。
show_result = 2
; 仅 [storyline] 段的调试开关：true/1=开启剧情简介抓取的详细调试输出；false/0=关闭。
; 注意：它与 [debug_mode] switch 相互独立，只影响剧情简介模块。
debug = true

; 繁简转换
[cc_convert]
; 转换模式：0=不转换 1=繁转简 2=简转繁。
mode = 1
; 需要执行繁简转换的字段(逗号分隔)，例如：outline,series,studio,tag,title。
vars = outline,series,studio,tag,title

[javdb]
; javdb 使用的镜像站点编号(逗号分隔)，对应 javdb 不同域名。默认 521。
sites = 521

; javlibrary 主站域名
; 默认 https://www.javlibrary.com（原始主站）
; 若主站被墙/失效，可改为主站或当前可用镜像（如 https://www.a95i.com），随时切换。
; 只填协议+域名，末尾不要带 /。
[javlibrary]
domain = https://www.javlibrary.com

; javbus 主站/备用镜像域名
; domain: 主站域名，默认 https://www.javbus.com
; mirror: 主站请求异常时的兜底镜像，默认 https://www.buscdn.casa
; 主站/镜像失效时可随时改这里切换，无需改代码。只填协议+域名，末尾不要带 /。
[javbus]
domain = https://www.javbus.com
mirror = https://www.buscdn.casa

; 人脸识别 locations_model=hog:方向梯度直方图(不太准确，速度快) cnn:深度学习模型(准确，需要GPU/CUDA,速度慢)
; uncensored_only=0:对全部封面进行人脸识别 1:只识别无码封面，有码封面直接切右半部分
; aways_imagecut=0:按各网站默认行为 1:总是裁剪封面，开启此项将无视[common]download_only_missing_images=1总是覆盖封面
; 封面裁剪的宽高比可配置，公式为 aspect_ratio/3。本文件默认 aspect_ratio=2.13，
; 适配大部分有码影片封面；前一版本默认为 2/3 即 aspect_ratio=2。
[face]
; 人脸检测模型：hog=方向梯度直方图(速度快、不太准确) cnn=深度学习模型(准确、需 GPU/CUDA、速度慢)。
locations_model = hog
; 是否只对人脸识别无码封面：0=对全部封面做人脸识别 1=只识别无码封面，有码封面直接裁右半部分。
uncensored_only = 1
; 是否总是裁剪封面：0=按各网站默认行为 1=总是裁剪。开启后将无视
; [common] download_only_missing_images=1，总是覆盖封面。
aways_imagecut = 0
; 封面裁剪宽高比(见上方说明)，公式为 aspect_ratio/3。
aspect_ratio = 2.13

[jellyfin]
; 多分段影片(如 -CD1/CD2)是否为每一段单独生成 fanart 封面：
; 0=否(默认，共用主封面) 1=是为每段建立独立封面(success目录内)。
multi_part_fanart = 0

[actor_photo]
; 是否为 KODI 下载演员头像(保存到影片目录的 .actors 子目录)：
; 0=不下载(默认) 1=下载。
download_for_kodi = 0

[direct]
; 是否在 .nfo 中写入导演(<director>)信息：1=写入(默认) 0=不写入。
switch = 1

; DMM/FANZA 高清图升级
; switch: 1=开启 0=关闭(默认)
; 开启后，当刮削得到的封面来自 DMM/FANZA(pics.dmm.co.jp) 时，
; 尝试替换为 DMM 官方高清 CDN(awsimgsrc.dmm.co.jp/pics_dig) 的图：
;   - 优先横版高清(pl.jpg)，无则退回竖版(ps.jpg)
; 注意：本项目仅升级 cover(封面)一处；poster/fanart/thumb 均由该封面复制派生，
;       因此它们也会一并变成同一张横版高清图(并不会单独使用竖版 ps.jpg)。
; 每个候选都会校验是否有效(HEAD 且分辨率≥700宽)，全部失败则保留原图，不影响刮削结果。
; 关闭时行为与升级前完全一致。
[dmm_image]
switch = 0

; DMM 官方 Affiliate API（FANZA 内容同源，更稳定）
; switch: 1=开启 0=关闭(默认)
; 开启后，fanza 数据源会优先调用 DMM 官方 Affiliate API
; (api.dmm.com/affiliate/v3/ItemList) 按番号检索；失败(无匹配/网络异常)时
; 自动回退到爬取 www.dmm.co.jp 详情页，不影响刮削结果。
; 注意：FANZA 是 DMM 的成人内容品牌(DMM.R18)，二者内容同源，API 检索即 FANZA 检索。
;
; 申请地址(免费)：
;   https://affiliate.dmm.com/   （注册后进入后台 -> API -> 获取 api_id priority与 affiliate_id）
;   英文说明：https://affiliate.dmm.com/en/
; 申请步骤简述：
;   1. 打开 https://affiliate.dmm.com/ 注册/登录 DMM 账号
;   2. 进入「API」页面，创建应用，复制 api_id 与 affiliate_id
;   3. 把两者填入下方（可留空则使用内置默认值，但默认值可能限流/失效，建议填自己的）
[dmm_api]
switch = 0
; api_id / affiliate_id 可留空，使用内置默认值(公开测试凭据)；强烈建议填自己的。
api_id =
affiliate_id =
